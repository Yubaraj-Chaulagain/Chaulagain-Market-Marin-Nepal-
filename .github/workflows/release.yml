name: Build and Release Android APK

on:
push:
branches:
- main
tags:
- 'v*'
workflow_dispatch:

permissions:
contents: write

jobs:
build-and-release:
name: Build APK and Publish Release
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Grant Gradle Permission
    run: chmod +x gradlew

  - name: Build Debug APK
    run: ./gradlew assembleDebug

  - name: Rename APK
    run: |
      mkdir -p release
      cp app/build/outputs/apk/debug/app-debug.apk \
      release/Home-Market-Manager-Nepal.apk

  - name: Generate Release Tag
    id: release_tag
    run: |
      if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
        TAG="${GITHUB_REF#refs/tags/}"
      else
        TAG="v1.0.${GITHUB_RUN_NUMBER}"
      fi
      echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  - name: Publish APK to GitHub Releases
    uses: softprops/action-gh-release@v2
    with:
      tag_name: ${{ steps.release_tag.outputs.tag }}
      name: Home Market Manager Nepal ${{ steps.release_tag.outputs.tag }}
      body: |
        ## Home & Market Manager Nepal

        Android APK Release

        ### Installation
        1. Download the APK.
        2. Open the APK on your Android phone.
        3. Allow installation from this source if prompted.
        4. Install the application.

      files: release/Home-Market-Manager-Nepal.apk
      make_latest: true
      fail_on_unmatched_files: true
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
